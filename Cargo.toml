[package]
name = "xenomit-bot-stream"
version = "0.1.0"
edition = "2024"
description = "Standalone read-only SSE gateway for xenomit-botd telemetry"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
